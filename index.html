<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Shadow | Portfolio</title>
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body class="landing-page">
  <!-- Overlay pour l'animation de transition de page -->
  <div class="page-transition-overlay"></div>

  <!-- Arrière-plan & Halo lumineux -->
  <div class="landing-bg"></div>
  <div class="landing-overlay"></div>

  <!-- Icônes flottantes -->
  <div class="floating-icons">
    <i class="fab fa-html5"></i>
    <i class="fab fa-css3-alt"></i>
    <i class="fab fa-js"></i>
    <i class="fab fa-react"></i>
    <i class="fab fa-node-js"></i>
    <i class="fab fa-python"></i>
    <i class="fas fa-database"></i>
    <i class="fab fa-git-alt"></i>
  </div>

  <!-- Hero Section -->
  <main class="hero">
    <div class="hero-content">
      <!-- Greeting avec typewriter fluide -->
      <p class="hero-greeting anim-1">
        Salut 👋, je suis <span class="typing-wrapper"><span class="typing-text">Dark Shadow</span></span>
      </p>

      <h1 class="hero-title anim-2">
        Fullstack <span>Developer</span>
      </h1>

      <p class="hero-desc anim-3">
        Développeur & Entrepreneur. Passionné par la création et la découverte de nouvelles technologies, j'aime concevoir des solutions élégantes, apprendre sans cesse et repousser les limites de mes projets.
      </p>

      <div class="hero-buttons anim-4">
        <a href="portfolio.html" class="btn-white transition-link">
          <span>Voir mon travail</span>
          <i class="fas fa-arrow-right btn-icon"></i>
        </a>
        <a href="portfolio.html#contact" class="btn-outline transition-link">
          <span>Me contacter</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Script JS de transition de page -->
  <script>
    document.querySelectorAll('.transition-link').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const targetUrl = this.getAttribute('href');
        
        // Déclenche l'animation de sortie
        document.body.classList.add('is-exiting');

        // Redirection après la transition
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 500);
      });
    });
  </script>
</body>
</html>
